<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>soundcheck has moved to soundcheck.club</title>
<link rel="canonical" href="https://soundcheck.club/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://soundcheck.club/">
<script>
(function(){
  // Retire the old /soundcheck/ PWA so it stops serving the stale shell.
  try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); } catch(e){}
  try { if (window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); } catch(e){}
  // Map /soundcheck/<rest> → https://soundcheck.club/<rest>, keeping query + hash.
  var rest = location.pathname.replace(/^\/soundcheck(\/|$)/, "/");
  location.replace("https://soundcheck.club" + rest + location.search + location.hash);
})();
</script>
<style>html{background:#0f0f12;color:#f3ece6;font-family:system-ui,sans-serif}body{display:grid;place-items:center;min-height:100vh;margin:0}a{color:#ff7a6b}</style>
</head>
<body>
<p>soundcheck has moved to <a href="https://soundcheck.club/">soundcheck.club</a> — redirecting…</p>
</body>
</html>
