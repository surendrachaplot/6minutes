<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>soundcheck by 6 Minutes · London tonight</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Synced with 6minutes.club tokens — same palette, accent overridden to red. */
      --black: #0d0d0d;
      --white: #ffffff;
      --off-white: #f7f6f4;
      --gray: #888888;
      --gray-light: #d4d4d4;
      --accent: #dc2626;        /* red-600 (was gold #c8a96e on 6minutes) */
      --accent-soft: #fef2f2;   /* red-50 */
      --border: #e8e8e8;

      --bg: var(--white);
      --fg: var(--black);
      --muted: var(--gray);
      --card: var(--white);
      --border-strong: #d1d5db;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 1px 3px rgba(15, 23, 42, 0.06), 0 6px 18px rgba(15, 23, 42, 0.05);
      --brand-sc: #ff5500;
      --brand-yt: #ff0000;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { background: var(--bg); }
    body {
      color: var(--fg);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 32px; }
    main.wrap { padding-bottom: 80px; }

    /* Nav — matches 6minutes.club exactly */
    nav {
      border-bottom: 1px solid var(--border);
      padding: 20px 0;
      margin-bottom: 32px;
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--black);
      text-decoration: none;
    }
    .logo .by {
      font-weight: 500;
      color: var(--gray);
      margin-left: 4px;
    }
    .logo:hover { color: var(--accent); }
    .logo:hover .by { color: var(--gray); }
    .nav-tag {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* Date picker — centered just below the nav */
    .date-picker-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
    }
    .date-picker {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gray);
    }
    .date-picker input,
    .date-picker button {
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
    }
    .date-picker input:focus,
    .date-picker button:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    .date-picker button { cursor: pointer; }
    .date-picker button:hover { border-color: var(--accent); color: var(--accent); }

    /* Hero — matches 6minutes.club editorial style */
    .hero { margin-bottom: 48px; }
    h1 {
      font-size: clamp(3rem, 8vw, 5rem);
      font-weight: 800;
      line-height: 1.0;
      letter-spacing: -0.04em;
      margin: 0 0 24px;
    }
    h1 .accent { color: var(--accent); }
    .meta {
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.6;
      color: #444444;
      max-width: 560px;
      margin: 0;
    }
    .meta a {
      color: var(--fg);
      text-decoration: underline;
      text-decoration-color: var(--border-strong);
      text-underline-offset: 3px;
    }
    .meta a:hover { color: var(--accent); text-decoration-color: var(--accent); }

    .status {
      padding: 16px 0 22px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }
    .status.error { color: #dc2626; }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 8px;
      border: 2px solid var(--border-strong);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: -3px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .event {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 24px;
      margin-bottom: 14px;
      transition: box-shadow 0.18s, border-color 0.18s;
    }
    .event:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
    }
    .event header { display: flex; gap: 16px; align-items: baseline; }
    .rank {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      min-width: 42px;
      padding-top: 4px;
    }
    .event h2 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
    .event h2 a { color: var(--fg); text-decoration: none; }
    .event h2 a:hover { color: var(--accent); }
    .sub {
      color: var(--gray);
      font-size: 0.78rem;
      margin-top: 6px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .sub .venue {
      color: var(--black);
      font-weight: 700;
    }
    .dot { padding: 0 6px; opacity: 0.5; }

    .lineup-more {
      list-style: none;
      padding: 8px 0 4px;
    }
    .more-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0;
    }
    .more-btn:hover { text-decoration: underline; }
    .lineup-hidden { display: none !important; }
    .lineup.expanded .lineup-hidden { display: flex !important; }

    /* Section eyebrow headings (South London Picks, Top 40 Tonight) */
    .section-eyebrow {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 16px;
    }
    .section-eyebrow.muted { color: var(--gray); }
    .section-picks { margin-bottom: 36px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    .section-top .section-eyebrow { margin-top: 8px; }

    /* Horizontal carousel for Picks — breaks out of the 720px column to be
       up to 1440px wide (2x default), centred on the viewport, with prev/next buttons. */
    .picks-carousel-wrap {
      position: relative;
      width: 100vw;
      max-width: 1440px;
      margin-left: 50%;
      transform: translateX(-50%);
    }
    .picks-carousel {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      overflow-y: visible;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 4px 56px 14px;   /* leave space for the nav buttons */
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }
    .picks-carousel::-webkit-scrollbar { height: 6px; }
    .picks-carousel::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 3px;
    }
    .picks-carousel::-webkit-scrollbar-track { background: transparent; }
    .picks-carousel .event {
      flex: 0 0 340px;
      min-width: 340px;
      max-width: 340px;
      scroll-snap-align: start;
      margin-bottom: 0;
    }
    /* Picks-card lineup: 2-column grid, no left indent (smaller card width). */
    .picks-carousel .event .lineup {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 12px;
      row-gap: 2px;
      padding: 14px 0 0;
    }
    .picks-carousel .event .lineup li {
      min-width: 0;   /* let names truncate inside the grid cell */
    }
    .picks-carousel .event .lineup .artist {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }
    .picks-carousel .event .lineup .lineup-more,
    .picks-carousel .event .lineup .player-row {
      grid-column: 1 / -1;
    }
    .picks-carousel .event .lineup .player-row {
      padding-left: 0 !important;
    }
    .carousel-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--black);
      font-family: inherit;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 0 3px;
      transition: color 0.12s, border-color 0.12s, transform 0.08s;
    }
    .carousel-nav.prev { left: 8px; }
    .carousel-nav.next { right: 8px; }
    .carousel-nav:hover { color: var(--accent); border-color: var(--accent); }
    .carousel-nav:active { transform: translateY(-50%) scale(0.94); }
    @media (max-width: 560px) {
      .picks-carousel-wrap { width: 100vw; }
      .picks-carousel { padding: 4px 20px 14px; }
      .picks-carousel .event { flex-basis: 86vw; min-width: 86vw; max-width: 86vw; }
      .carousel-nav { display: none; }
    }

    .lineup { list-style: none; padding: 14px 0 0 56px; margin: 0; }
    .lineup li {
      padding: 5px 0;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .artist {
      color: var(--fg);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px dotted var(--border-strong);
    }
    .artist:hover { color: var(--accent); border-bottom-color: var(--accent); }

    .play {
      background: var(--card);
      border-radius: 6px;
      height: 24px;
      padding: 0 7px;
      font-size: 9px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      color: var(--muted);
      transition: background 0.12s, color 0.12s, border-color 0.12s, transform 0.08s;
    }
    .play:hover { transform: translateY(-1px); }
    .play:active { transform: translateY(0); }
    .play .brand { width: 14px; height: 14px; display: block; flex-shrink: 0; }
    .play .state { font-size: 10px; line-height: 1; }
    .play.sc:hover,
    .play.sc.playing {
      color: var(--brand-sc);
      border-color: var(--brand-sc);
      background: rgba(255, 85, 0, 0.08);
    }
    .play.yt:hover,
    .play.yt.playing {
      color: var(--brand-yt);
      border-color: var(--brand-yt);
      background: rgba(255, 0, 0, 0.06);
    }
    .play[disabled] { opacity: 0.55; cursor: progress; }
    .play.spinning .brand,
    .play.spinning .state { visibility: hidden; }
    .play.spinning { position: relative; }
    .play.spinning::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .no-sc {
      color: var(--border-strong);
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 500;
    }

    .player-row {
      display: block !important;
      padding: 10px 0 12px 56px !important;
    }
    .player-row iframe {
      width: 100%;
      max-width: 580px;
      border: 0;
      border-radius: 8px;
      display: block;
      box-shadow: var(--shadow-sm);
    }
    .player-row iframe.sc { height: 120px; }
    .player-row iframe.yt { aspect-ratio: 16 / 9; height: auto; }
    .player-row .yt-msg {
      color: var(--muted);
      font-size: 13px;
      font-style: italic;
    }
    footer {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      margin-top: 40px;
      text-align: center;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    /* Email gate modal */
    .email-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13, 13, 13, 0.55);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      animation: fade-in 0.18s ease;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .email-modal {
      background: var(--white);
      border-radius: 14px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }
    .email-modal h3 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin: 0 0 6px;
      line-height: 1.1;
    }
    .email-modal .accent { color: var(--accent); }
    .email-modal p {
      color: var(--gray);
      font-size: 0.92rem;
      margin: 0 0 18px;
      line-height: 1.5;
    }
    .email-form { display: flex; gap: 8px; }
    .email-form input {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      min-width: 0;
    }
    .email-form input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    .email-form button {
      background: var(--black);
      color: var(--white);
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      font: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s;
    }
    .email-form button:hover { background: var(--accent); }
    .email-form button[disabled] { opacity: 0.6; cursor: progress; }
    .email-err {
      color: var(--accent);
      font-size: 0.82rem;
      margin: 10px 0 0;
      min-height: 1.2em;
    }

    @media (max-width: 560px) {
      .wrap { padding: 0 20px; }
      main.wrap { padding-bottom: 64px; }
      nav { padding: 16px 0; margin-bottom: 24px; }
      .date-picker-wrap { margin-bottom: 32px; }
      .hero { margin-bottom: 36px; }
      .event { padding: 18px 18px; }
      .lineup { padding-left: 0; }
      .player-row { padding-left: 0 !important; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="wrap">
      <div class="nav-inner">
        <a class="logo" href=".">SOUNDCHECK <span class="by">by 6 Minutes</span></a>
        <span class="nav-tag">London &middot; Tonight</span>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <section class="hero">
      <h1>London <span class="accent">Tonight</span>.</h1>
      <p class="meta">Discover and listen to all artists playing tonight.</p>
    </section>

    <section class="date-picker-wrap">
      <div class="date-picker">
        <label for="date-input">Date</label>
        <input id="date-input" type="date" />
        <button id="refresh-btn" title="Refresh (bypass cache)">&#x21bb;</button>
      </div>
    </section>

    <div id="status" class="status"></div>
    <div id="events"></div>
  </main>
  <script>
    // Where the /api/* endpoints live. Set automatically based on host:
    //   localhost -> '' (same origin)
    //   anywhere else -> the Render URL below.
    // After you deploy the API to Render, replace YOUR-RENDER-URL.onrender.com
    // with the real URL Render gave you (no trailing slash).
    var API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? ''
      : 'https://soundcheck-api-15aq.onrender.com';

    (async function () {
      var dateInput = document.getElementById('date-input');
      var refreshBtn = document.getElementById('refresh-btn');
      var statusEl = document.getElementById('status');
      var eventsEl = document.getElementById('events');

      function todayISO() {
        var d = new Date();
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var dd = String(d.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + dd;
      }

      function escape(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Curated venues that get pulled into the "Picks" section.
      // Matched as case-insensitive word-boundary patterns against ev.venue.
      var PICK_PATTERNS = [
        /\bm\.?\s?o\.?\s?t\b/i,   // M.O.T / MOT
        /\bphonox\b/i,
        /\bormside\b/i,            // Ormside Projects
        /\bfold\b/i                // FOLD (Canning Town)
      ];
      function isPickVenue(venue) {
        if (!venue) return false;
        return PICK_PATTERNS.some(function (re) { return re.test(venue); });
      }

      function formatTime(iso) {
        if (!iso) return '';
        // "2026-05-30T12:00:00.000" -> "12:00". Date context is implicit
        // from the universal date picker; only the time is useful here.
        var m = /T(\d{2}:\d{2})/.exec(iso);
        return m ? m[1] : '';
      }

      function normaliseSc(url) {
        if (!url) return null;
        var u = url.trim();
        if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
        // SC widget rejects www.soundcloud.com — collapse to bare host
        u = u.replace(/^https?:\/\/www\.soundcloud\.com/i, 'https://soundcloud.com');
        // strip trailing slash for tidiness
        u = u.replace(/\/+$/, '');
        return u;
      }

      // Official SimpleIcons brand marks (CC0). YT is hand-coloured as
      // a 2-element SVG so the play triangle always shows white.
      var SC_SVG = '<svg class="brand" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
        '<path fill="#ff5500" d="M23.999 14.165c-.052 1.796-1.612 3.169-3.4 3.169h-8.18a.68.68 0 0 1-.675-.683V7.862a.747.747 0 0 1 .452-.724s.75-.513 2.333-.513a5.364 5.364 0 0 1 2.763.755 5.433 5.433 0 0 1 2.57 3.54c.282-.08.574-.121.868-.12.884 0 1.73.358 2.347.992s.948 1.49.922 2.373ZM10.721 8.421c.247 2.98.427 5.697 0 8.672a.264.264 0 0 1-.53 0c-.395-2.946-.22-5.718 0-8.672a.264.264 0 0 1 .53 0ZM9.072 9.448c.285 2.659.37 4.986-.006 7.655a.277.277 0 0 1-.55 0c-.331-2.63-.256-5.02 0-7.655a.277.277 0 0 1 .556 0Zm-1.663-.257c.27 2.726.39 5.171 0 7.904a.266.266 0 0 1-.532 0c-.38-2.69-.257-5.21 0-7.904a.266.266 0 0 1 .532 0Zm-1.647.77a26.108 26.108 0 0 1-.008 7.147.272.272 0 0 1-.542 0 27.955 27.955 0 0 1 0-7.147.275.275 0 0 1 .55 0Zm-1.67 1.769c.421 1.865.228 3.5-.029 5.388a.257.257 0 0 1-.514 0c-.21-1.858-.398-3.549 0-5.389a.272.272 0 0 1 .543 0Zm-1.655-.273c.388 1.897.26 3.508-.01 5.412-.026.28-.514.283-.54 0-.244-1.878-.347-3.54-.01-5.412a.283.283 0 0 1 .56 0Zm-1.668.911c.4 1.268.257 2.292-.026 3.572a.257.257 0 0 1-.514 0c-.241-1.262-.354-2.312-.023-3.572a.283.283 0 0 1 .563 0Z"/>' +
        '</svg>';
      var YT_SVG = '<svg class="brand" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
        '<path fill="#ff0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/>' +
        '<polygon fill="#fff" points="9.545,15.568 9.545,8.432 15.818,12"/>' +
        '</svg>';

      function setState(btn, ch) {
        var s = btn.querySelector('.state');
        if (s) s.textContent = ch;
      }

      // ── Email gate ─────────────────────────────────────────────
      // First ▶ click prompts for an email; remembered in localStorage so
      // subsequent plays skip the modal. Submission is best-effort: even if
      // the API call fails, playback proceeds (collection is not the point
      // of the user's interaction).
      var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      function hasEmail() {
        try {
          var v = localStorage.getItem('sc_email');
          return !!v && EMAIL_RE.test(v);
        } catch (_) { return false; }
      }
      function ensureEmailGate() {
        if (hasEmail()) return Promise.resolve(true);
        return new Promise(function (resolve) {
          var overlay = document.createElement('div');
          overlay.className = 'email-overlay';
          overlay.innerHTML =
            '<div class="email-modal" role="dialog" aria-modal="true">' +
              '<h3>One thing <span class="accent">first</span>.</h3>' +
              '<p>Drop your email to start the music. We&rsquo;ll send the occasional pick &mdash; nothing more.</p>' +
              '<form class="email-form">' +
                '<input type="email" required placeholder="you@somewhere.com" autocomplete="email" />' +
                '<button type="submit">Play</button>' +
              '</form>' +
              '<p class="email-err" aria-live="polite"></p>' +
            '</div>';
          document.body.appendChild(overlay);
          var input = overlay.querySelector('input');
          var submit = overlay.querySelector('button[type="submit"]');
          var errEl = overlay.querySelector('.email-err');
          var form = overlay.querySelector('form');
          setTimeout(function () { input.focus(); }, 30);

          form.addEventListener('submit', async function (e) {
            e.preventDefault();
            errEl.textContent = '';
            var email = input.value.trim().toLowerCase();
            if (!EMAIL_RE.test(email) || email.length > 254) {
              errEl.textContent = 'That doesn’t look like an email.';
              return;
            }
            submit.disabled = true;
            try {
              await fetch(API_BASE + '/api/email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
              });
            } catch (_) {
              // Best-effort. Even on network failure, let them play.
            }
            try { localStorage.setItem('sc_email', email); } catch (_) {}
            overlay.remove();
            resolve(true);
          });
        });
      }

      var active = null;
      function stopActive() {
        if (!active) return;
        active.button.classList.remove('playing');
        setState(active.button, '▶');
        if (active.row && active.row.parentNode) active.row.remove();
        active = null;
      }

      function openPlayer(btn, iframe) {
        var li = document.createElement('li');
        li.className = 'player-row';
        li.appendChild(iframe);
        btn.closest('li').insertAdjacentElement('afterend', li);
        btn.classList.add('playing');
        setState(btn, '■');
        active = { button: btn, row: li };
      }

      function showInlineMessage(btn, text) {
        var li = document.createElement('li');
        li.className = 'player-row';
        var span = document.createElement('span');
        span.className = 'yt-msg';
        span.textContent = text;
        li.appendChild(span);
        btn.closest('li').insertAdjacentElement('afterend', li);
        setTimeout(function () { if (li.parentNode) li.remove(); }, 3000);
      }

      function playSc(btn) {
        var iframe = document.createElement('iframe');
        iframe.allow = 'autoplay';
        iframe.className = 'sc';
        iframe.src =
          'https://w.soundcloud.com/player/?url=' +
          encodeURIComponent(btn.dataset.sc) +
          '&color=%23dc2626&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=false';
        openPlayer(btn, iframe);
      }

      function playYt(btn, videoId) {
        var iframe = document.createElement('iframe');
        iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
        iframe.allowFullscreen = true;
        iframe.className = 'yt';
        // Use youtube-nocookie.com so the embed doesn't inherit the user's
        // signed-in Google session — avoids "Playback paused because your
        // account is being used in another location" errors.
        iframe.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(videoId) + '?autoplay=1&rel=0';
        openPlayer(btn, iframe);
      }

      async function handleYtClick(btn) {
        var wasMe = active && active.button === btn;
        stopActive();
        if (wasMe) return;

        // Try cached videoId on the button first (set after a previous fetch)
        if (btn.dataset.yt) {
          playYt(btn, btn.dataset.yt);
          return;
        }

        btn.disabled = true;
        btn.classList.add('spinning');
        try {
          var url = API_BASE + '/api/youtube?slug=' + encodeURIComponent(btn.dataset.slug) +
                    '&name=' + encodeURIComponent(btn.dataset.name);
          var res = await fetch(url);
          var json = await res.json().catch(function () { return {}; });
          if (res.status === 404) {
            showInlineMessage(btn, 'No long-form YouTube set found for this artist.');
            return;
          }
          if (!res.ok) {
            showInlineMessage(btn, 'YouTube error: ' + (json.error || res.status));
            return;
          }
          btn.dataset.yt = json.videoId;
          playYt(btn, json.videoId);
        } catch (err) {
          showInlineMessage(btn, 'YouTube request failed: ' + err.message);
        } finally {
          btn.disabled = false;
          btn.classList.remove('spinning');
        }
      }

      function wirePlayButtons(scope) {
        scope.querySelectorAll('.play.sc').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            var wasMe = active && active.button === btn;
            // Stopping/closing the current player doesn't need a gate.
            if (wasMe) { stopActive(); return; }
            if (!(await ensureEmailGate())) return;
            stopActive();
            playSc(btn);
          });
        });
        scope.querySelectorAll('.play.yt').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            var wasMe = active && active.button === btn;
            if (wasMe) { stopActive(); return; }
            if (!(await ensureEmailGate())) return;
            handleYtClick(btn);
          });
        });
        scope.querySelectorAll('.carousel-nav').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var wrap = btn.closest('.picks-carousel-wrap');
            var carousel = wrap ? wrap.querySelector('.picks-carousel') : null;
            if (!carousel) return;
            var card = carousel.querySelector('.event');
            var step = (card ? card.offsetWidth : 340) + 14;
            carousel.scrollBy({
              left: btn.classList.contains('prev') ? -step : step,
              behavior: 'smooth'
            });
          });
        });
        scope.querySelectorAll('.more-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var ul = btn.closest('ul.lineup');
            if (!ul) return;
            var expanded = ul.classList.toggle('expanded');
            var extra = btn.dataset.extra || ul.querySelectorAll('.lineup-hidden').length;
            btn.textContent = expanded ? 'Show less' : 'Show ' + extra + ' more';
            // If we just collapsed and the currently-playing artist is now hidden,
            // stop playback so audio doesn't keep going out of view.
            if (!expanded && active && active.button.closest('.lineup-hidden')) {
              stopActive();
            }
          });
        });
      }

      var DEFAULT_INITIAL_COUNT = 10;

      function renderEventCard(ev, rank, initialCount) {
        if (initialCount == null) initialCount = DEFAULT_INITIAL_COUNT;
        var venue = ev.venue ? escape(ev.venue) : 'TBA';
        // Don't link to ra.co — send curious users to a Google search instead.
        var eventQuery = ev.title + (ev.venue ? ' ' + ev.venue : '') + ' london';
        var eventUrl = 'https://www.google.com/search?q=' + encodeURIComponent(eventQuery);
        var interested = (ev.attending || 0).toLocaleString();
        var timeStr = formatTime(ev.startTime);
        var startTime = timeStr ? '<span class="dot">·</span><span>' + timeStr + '</span>' : '';

        var allArtists = ev.artists || [];
        var artistsHtml = '';
        allArtists.forEach(function (a, idx) {
          if (idx === initialCount) {
            artistsHtml += '<li class="lineup-more"><button class="more-btn" type="button" data-extra="' + (allArtists.length - initialCount) + '">Show ' + (allArtists.length - initialCount) + ' more</button></li>';
          }
          var slug = a.contentUrl ? a.contentUrl.split('/').filter(Boolean).pop() : '';
          // Link artist name to their SoundCloud if known, else a Google search
          // for them as a DJ. We never link out to ra.co for artist names.
          var scForLink = normaliseSc(a.soundcloud);
          var artistHref = scForLink
            ? scForLink
            : 'https://www.google.com/search?q=' + encodeURIComponent(a.name + ' dj');
          var nameLink = '<a class="artist" href="' + escape(artistHref) + '" target="_blank" rel="noopener noreferrer">' + escape(a.name) + '</a>';
          var sc = normaliseSc(a.soundcloud);
          var scBtn = sc
            ? '<button class="play sc" data-sc="' + escape(sc) + '" title="Play top SoundCloud track" aria-label="Play ' + escape(a.name) + ' on SoundCloud">' + SC_SVG + '<span class="state">&#9654;</span></button>'
            : '<span class="no-sc" title="No SoundCloud on RA profile">&mdash;</span>';
          var ytBtn = slug
            ? '<button class="play yt" data-slug="' + escape(slug) + '" data-name="' + escape(a.name) + '" title="Play full DJ set on YouTube" aria-label="Play ' + escape(a.name) + ' DJ set on YouTube">' + YT_SVG + '<span class="state">&#9654;</span></button>'
            : '';
          var liCls = idx >= initialCount ? ' class="lineup-hidden"' : '';
          artistsHtml += '<li' + liCls + '>' + scBtn + ytBtn + ' ' + nameLink + '</li>';
        });
        if (!artistsHtml) artistsHtml = '<li><em>No lineup published</em></li>';

        var rankHtml = rank != null ? '<div class="rank">#' + rank + '</div>' : '';
        return '<section class="event">' +
          '<header>' +
            rankHtml +
            '<div class="event-meta">' +
              '<h2><a href="' + escape(eventUrl) + '" target="_blank" rel="noopener noreferrer">' + escape(ev.title) + '</a></h2>' +
              '<div class="sub">' +
                '<span class="venue">' + venue + '</span>' +
                '<span class="dot">·</span>' +
                '<span>' + interested + ' interested</span>' +
                startTime +
              '</div>' +
            '</div>' +
          '</header>' +
          '<ul class="lineup">' + artistsHtml + '</ul>' +
        '</section>';
      }

      function renderEvents(data) {
        active = null;
        if (!data.events || data.events.length === 0) {
          eventsEl.innerHTML = '<div class="status">No events found for ' + escape(data.date) + '.</div>';
          return;
        }

        var picks = data.events.filter(function (ev) { return isPickVenue(ev.venue); });
        var all = data.events;

        var html = '';
        if (picks.length > 0) {
          html += '<section class="section-picks">' +
            '<h2 class="section-eyebrow">Picks</h2>' +
            '<div class="picks-carousel-wrap">' +
              '<button class="carousel-nav prev" type="button" aria-label="Scroll picks left">&lsaquo;</button>' +
              '<div class="picks-carousel">';
          picks.forEach(function (ev) { html += renderEventCard(ev, null, 4); });
          html += '</div>' +
              '<button class="carousel-nav next" type="button" aria-label="Scroll picks right">&rsaquo;</button>' +
            '</div>' +
          '</section>';
        }

        html += '<section class="section-top">';
        if (picks.length > 0) {
          html += '<h2 class="section-eyebrow muted">Most Popular</h2>';
        }
        all.forEach(function (ev, i) { html += renderEventCard(ev, i + 1); });
        html += '</section>';

        eventsEl.innerHTML = html;
        wirePlayButtons(eventsEl);
      }

      function setStatus(html, isError) {
        statusEl.innerHTML = html || '';
        statusEl.className = 'status' + (isError ? ' error' : '');
      }

      async function load(date, opts) {
        opts = opts || {};
        stopActive();
        document.title = 'soundcheck by 6 Minutes · ' + date;
        history.replaceState(null, '', '?date=' + date);
        setStatus('<span class="spinner"></span> Fetching events and SoundCloud links for ' + escape(date) + '…');
        eventsEl.innerHTML = '';
        try {
          var url = API_BASE + '/api/day?date=' + encodeURIComponent(date) + (opts.refresh ? '&refresh=1' : '');
          var res = await fetch(url);
          var json = await res.json();
          if (!res.ok) throw new Error(json.error || ('HTTP ' + res.status));
          renderEvents(json);
          setStatus('');
        } catch (err) {
          setStatus('Error: ' + escape(err.message || String(err)), true);
        }
      }

      var initial = new URLSearchParams(location.search).get('date') || todayISO();
      dateInput.value = initial;
      dateInput.addEventListener('change', function () {
        if (dateInput.value) load(dateInput.value);
      });
      refreshBtn.addEventListener('click', function () {
        if (dateInput.value) load(dateInput.value, { refresh: true });
      });

      load(initial);
    })();
  </script>
</body>
</html>
