<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>soundcheck by 6 Minutes · London tonight</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <style>
    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#0f0f12; --surface:#1b1b20; --fg:#f3ece6; --muted:#9292a0;
      --accent:#ff7a6b; --border:#28282f;
      --head:"Bricolage Grotesque",sans-serif; --body:"Inter",sans-serif;
    }
    html { scroll-behavior:smooth; }
    body { background:var(--bg); color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
    a { color:inherit; }
    .wrap { max-width:1340px; margin:0 auto; padding:0 40px; }

    /* nav */
    nav { display:flex; align-items:center; justify-content:space-between; padding:22px 0; border-bottom:1px solid var(--border); }
    .logo { font-family:var(--head); font-weight:800; font-size:0.82rem; letter-spacing:0.28em; text-transform:uppercase; color:var(--fg); text-decoration:none; }
    .logo:hover { color:var(--accent); }
    .by { font-size:0.62rem; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); text-decoration:none; transition:opacity 0.12s; }
    .by:hover { opacity:0.7; }

    /* hero */
    .hero { padding:44px 0 28px; display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; }
    .eyebrow { font-size:0.64rem; font-weight:700; letter-spacing:0.24em; text-transform:uppercase; color:var(--accent); margin-bottom:16px; }
    h1 { font-family:var(--head); font-weight:800; font-size:clamp(2.8rem,7vw,5rem); line-height:0.94; letter-spacing:-0.04em; }
    h1 .ac { color:var(--accent); }
    .date-pill { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:999px; padding:6px; position:relative; }
    .date-pill .lbl { font-size:0.8rem; font-weight:600; padding:0 12px; cursor:pointer; white-space:nowrap; }
    .date-pill .lbl:hover { color:var(--accent); }
    .date-pill .nav-btn { width:30px; height:30px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--fg); cursor:pointer; font-size:13px; line-height:1; }
    .date-pill .nav-btn:hover { border-color:var(--accent); color:var(--accent); }
    .date-pill input[type=date] { position:absolute; left:0; bottom:-2px; width:1px; height:1px; opacity:0; border:0; padding:0; }

    /* marquee — very slow ambient ticker */
    .marquee { overflow:hidden; border-top:1px solid var(--border); border-bottom:1px solid var(--border); margin-top:6px; }
    .marquee .track { display:inline-flex; white-space:nowrap; animation:marq 375s linear infinite; padding:12px 0; }
    .marquee span { font-family:var(--head); font-weight:800; font-size:1.4rem; letter-spacing:-0.01em; text-transform:uppercase; padding:0 22px; }
    .marquee span.star { color:var(--accent); }
    @keyframes marq { to { transform:translateX(-50%); } }

    /* status */
    .status { padding:14px 0; color:var(--muted); font-size:14px; font-weight:500; }
    .status.error { color:#ff6b6b; }
    .spinner { display:inline-block; width:14px; height:14px; margin-right:8px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:-3px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* grid */
    .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:26px 22px; padding:8px 0 56px; align-items:start; }
    .gcard { display:flex; flex-direction:column; min-width:0; }
    .poster { position:relative; width:100%; aspect-ratio:3/4; border-radius:10px; overflow:hidden; background:var(--surface); margin-bottom:13px; }
    .poster .gen { position:absolute; inset:0; display:flex; align-items:flex-end; padding:12px; background:linear-gradient(var(--ang,150deg), var(--g1,#ff7a6b), var(--g2,#1b1b20)); }
    .poster .gen .gt { font-family:var(--head); font-weight:800; font-size:0.92rem; line-height:1.05; letter-spacing:-0.01em; color:#fff; text-shadow:0 1px 10px rgba(0,0,0,0.4); }
    .poster img.real { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:grayscale(0.7) contrast(1.04); }
    .poster .tint { position:absolute; inset:0; background:var(--accent); mix-blend-mode:screen; opacity:0.2; pointer-events:none; }
    .gcard .pick { display:inline-block; font-size:0.54rem; font-weight:800; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); border:1px solid var(--accent); border-radius:4px; padding:2px 6px; margin-bottom:8px; align-self:flex-start; }
    .gcard h3 { font-family:var(--head); font-size:1.05rem; font-weight:700; letter-spacing:-0.015em; line-height:1.15; }
    .gcard .meta { font-size:0.72rem; color:var(--muted); font-weight:600; margin-top:4px; }
    .gcard .meta b { color:var(--fg); }
    .line { list-style:none; margin:12px 0 0; display:flex; flex-direction:column; gap:7px; }
    .line li { display:flex; align-items:center; gap:8px; font-size:0.84rem; font-weight:500; min-width:0; }
    .line li .an { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .line li.tba { color:var(--muted); font-style:italic; font-size:0.8rem; }
    .line li.hid { display:none; }
    .line.exp li.hid { display:flex; }
    .more-li { margin-top:1px; }
    .more-btn { background:transparent; border:none; color:var(--accent); font-family:inherit; font-size:0.62rem; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; cursor:pointer; padding:0; }
    .more-btn:hover { text-decoration:underline; }
    .player-slot:not(:empty) { margin-top:12px; }
    .player-slot iframe { width:100%; border:0; border-radius:8px; display:block; }
    .player-slot iframe.sc { height:120px; }
    .player-slot iframe.yt { aspect-ratio:16/9; height:auto; }
    .yt-msg { color:var(--muted); font-size:0.78rem; font-style:italic; margin-top:8px; }

    /* play pills */
    .play { width:22px; height:22px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; font-size:8px; border:1px solid; cursor:pointer; background:transparent; padding:0; position:relative; flex-shrink:0; }
    .play .brand { width:13px; height:13px; display:block; }
    .play .state { font-size:9px; }
    .play.sc { color:#ff7a6b; border-color:var(--accent); }
    .play.yt { color:var(--fg); border-color:var(--muted); }
    .play:hover { transform:translateY(-1px); }
    .play.playing.sc { background:var(--accent); color:#1a0f0e; }
    .play.playing.yt { background:var(--fg); color:var(--bg); }
    .play[disabled] { opacity:0.55; cursor:progress; }
    .play.spinning .brand, .play.spinning .state { visibility:hidden; }
    .play.spinning::after { content:""; position:absolute; left:50%; top:50%; width:10px; height:10px; margin:-5px 0 0 -5px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite; }
    .no-sc { width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; color:var(--border); flex-shrink:0; }

    /* inline signup */
    .signup { margin:0 0 60px; padding:38px 28px; background:var(--surface); border:1px solid var(--border); border-radius:14px; text-align:center; }
    .signup .se { font-size:0.62rem; font-weight:700; letter-spacing:0.28em; text-transform:uppercase; color:var(--accent); margin-bottom:12px; }
    .signup h3 { font-family:var(--head); font-size:1.8rem; font-weight:800; letter-spacing:-0.025em; margin-bottom:8px; }
    .signup .sd { color:var(--muted); font-size:0.92rem; margin-bottom:20px; }
    .email-form { display:flex; gap:8px; max-width:380px; margin:0 auto; }
    .email-form input { flex:1; min-width:0; padding:11px 14px; border:1px solid var(--border); border-radius:8px; font:inherit; font-size:14px; background:var(--bg); color:var(--fg); }
    .email-form input:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
    .email-form button { background:var(--accent); color:#1a0f0e; border:none; border-radius:8px; padding:11px 18px; font:inherit; font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap; }
    .email-form button:hover { opacity:0.9; }
    .signup-success { color:var(--accent); font-weight:600; font-size:0.95rem; }

    /* email gate modal */
    .email-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; }
    .email-modal { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:32px 28px; max-width:420px; width:100%; position:relative; }
    .email-close { position:absolute; top:12px; right:12px; width:30px; height:30px; background:transparent; border:none; color:var(--muted); font-size:22px; cursor:pointer; border-radius:999px; }
    .email-close:hover { background:var(--bg); color:var(--fg); }
    .email-modal h3 { font-family:var(--head); font-size:1.5rem; font-weight:800; letter-spacing:-0.025em; margin-bottom:6px; }
    .email-modal h3 .ac { color:var(--accent); }
    .email-modal p { color:var(--muted); font-size:0.92rem; margin-bottom:18px; }
    .email-err { color:var(--accent); font-size:0.82rem; margin-top:10px; min-height:1.2em; }

    /* now playing */
    .np { position:fixed; left:0; right:0; bottom:0; background:var(--accent); color:#1a0f0e; padding:13px 24px; display:flex; align-items:center; gap:14px; z-index:60; transform:translateY(100%); transition:transform 0.3s; }
    .np.show { transform:translateY(0); }
    .np .pulse { width:8px; height:8px; border-radius:50%; background:#1a0f0e; animation:pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:0.35;} 50%{opacity:1;} }
    .np .nm { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .np .src { font-size:0.7rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; opacity:0.7; flex-shrink:0; }
    .np .stop { margin-left:auto; background:transparent; border:1px solid rgba(0,0,0,0.3); color:#1a0f0e; border-radius:999px; width:30px; height:30px; cursor:pointer; font-size:10px; flex-shrink:0; }
    body.has-np .grid { padding-bottom:80px; }

    @media (max-width:1180px) { .grid { grid-template-columns:repeat(4,1fr); } }
    @media (max-width:920px)  { .grid { grid-template-columns:repeat(3,1fr); } .wrap{ padding:0 28px; } }
    @media (max-width:620px)  { .grid { grid-template-columns:repeat(2,1fr); } .wrap{ padding:0 18px; } }
    @media (max-width:380px)  { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="wrap">
    <nav>
      <a class="logo" href=".">SOUNDCHECK</a>
      <a class="by" href="https://6minutes.club" target="_blank" rel="noopener">by 6 Minutes</a>
    </nav>

    <div class="hero">
      <div>
        <p class="eyebrow" id="eyebrow">Tonight in London</p>
        <h1>London <span class="ac">Tonight</span>.</h1>
      </div>
      <div class="date-pill">
        <button class="nav-btn" id="prev-day" aria-label="Previous day">&lsaquo;</button>
        <span class="lbl" id="date-label">&mdash;</span>
        <button class="nav-btn" id="next-day" aria-label="Next day">&rsaquo;</button>
        <input type="date" id="date-input" />
      </div>
    </div>

    <div class="marquee" id="marquee"><div class="track" id="track"></div></div>

    <div class="status" id="status"></div>
    <div class="grid" id="grid"></div>

    <section class="signup" id="signup">
      <p class="se">The List</p>
      <h3>Get a weekly digest.</h3>
      <p class="sd">London&rsquo;s most interesting nights, picked &amp; sent every Wednesday.</p>
      <form class="email-form" id="inline-form">
        <input type="email" required placeholder="you@somewhere.com" autocomplete="email" />
        <button type="submit">Subscribe</button>
      </form>
      <p class="signup-success" id="signup-success" hidden>You&rsquo;re on the list. &#x2713;</p>
    </section>
  </main>

  <div class="np" id="now-playing" role="status" aria-live="polite">
    <span class="pulse"></span>
    <span class="nm" id="np-name">&mdash;</span>
    <span class="src" id="np-src">SOUNDCLOUD</span>
    <button class="stop" id="np-stop" aria-label="Stop playback">&#9632;</button>
  </div>

  <script>
    var API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? ''
      : 'https://soundcheck-api-15aq.onrender.com';

    var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    var SC_SVG = '<svg class="brand" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="#ff7a6b" d="M23.999 14.165c-.052 1.796-1.612 3.169-3.4 3.169h-8.18a.68.68 0 0 1-.675-.683V7.862a.747.747 0 0 1 .452-.724s.75-.513 2.333-.513a5.364 5.364 0 0 1 2.763.755 5.433 5.433 0 0 1 2.57 3.54c.282-.08.574-.121.868-.12.884 0 1.73.358 2.347.992s.948 1.49.922 2.373ZM10.721 8.421c.247 2.98.427 5.697 0 8.672a.264.264 0 0 1-.53 0c-.395-2.946-.22-5.718 0-8.672a.264.264 0 0 1 .53 0ZM9.072 9.448c.285 2.659.37 4.986-.006 7.655a.277.277 0 0 1-.55 0c-.331-2.63-.256-5.02 0-7.655a.277.277 0 0 1 .556 0Zm-1.663-.257c.27 2.726.39 5.171 0 7.904a.266.266 0 0 1-.532 0c-.38-2.69-.257-5.21 0-7.904a.266.266 0 0 1 .532 0Zm-1.647.77a26.108 26.108 0 0 1-.008 7.147.272.272 0 0 1-.542 0 27.955 27.955 0 0 1 0-7.147.275.275 0 0 1 .55 0Zm-1.67 1.769c.421 1.865.228 3.5-.029 5.388a.257.257 0 0 1-.514 0c-.21-1.858-.398-3.549 0-5.389a.272.272 0 0 1 .543 0Zm-1.655-.273c.388 1.897.26 3.508-.01 5.412-.026.28-.514.283-.54 0-.244-1.878-.347-3.54-.01-5.412a.283.283 0 0 1 .56 0Zm-1.668.911c.4 1.268.257 2.292-.026 3.572a.257.257 0 0 1-.514 0c-.241-1.262-.354-2.312-.023-3.572a.283.283 0 0 1 .563 0Z"/></svg>';
    var YT_SVG = '<svg class="brand" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="#ff0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/><polygon fill="#fff" points="9.545,15.568 9.545,8.432 15.818,12"/></svg>';

    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function formatTime(iso){ if(!iso) return ''; var m=/T(\d{2}:\d{2})/.exec(iso); return m?m[1]:''; }
    function normaliseSc(url){ if(!url) return null; var u=url.trim(); if(!/^https?:\/\//i.test(u)) u='https://'+u; u=u.replace(/^https?:\/\/www\.soundcloud\.com/i,'https://soundcloud.com'); return u.replace(/\/+$/,''); }

    var RE_FOLD=/\bfold\b/i, RE_MOT=/\bm\.?\s?o\.?\s?t\b/i, RE_PHONOX=/\bphonox\b/i, RE_ORMSIDE=/\bormside\b/i;
    function isPickVenue(v){ if(!v) return false; return RE_FOLD.test(v)||RE_MOT.test(v)||RE_PHONOX.test(v)||RE_ORMSIDE.test(v); }

    // deterministic warm gradient for generated posters
    function hashStr(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }
    function genPoster(title){
      var h=hashStr(title), hue=((h%70)+340)%360, ang=110+(h%80);
      return '<div class="gen" style="--ang:'+ang+'deg;--g1:hsl('+hue+' 68% 54%);--g2:hsl('+((hue+18)%360)+' 45% 11%)"><span class="gt">'+esc(title)+'</span></div>';
    }
    function posterHTML(ev){
      var img=ev.poster?'<img class="real" src="'+API_BASE+'/api/img?u='+encodeURIComponent(ev.poster)+'" alt="" onerror="this.style.display=\'none\'">':'';
      return '<div class="poster">'+genPoster(ev.title||'Event')+img+'<span class="tint"></span></div>';
    }

    // ── email gate ──
    function hasEmail(){ try{ var v=localStorage.getItem('sc_email'); return !!v && EMAIL_RE.test(v);}catch(_){return false;} }
    function ensureEmailGate(){
      if(hasEmail()) return Promise.resolve(true);
      return new Promise(function(resolve){
        var ov=document.createElement('div'); ov.className='email-overlay';
        ov.innerHTML='<div class="email-modal" role="dialog" aria-modal="true">'+
          '<button class="email-close" type="button" aria-label="Close">&times;</button>'+
          '<h3>One thing <span class="ac">first</span>.</h3>'+
          '<p>Drop your email to start the music. We&rsquo;ll send the occasional pick &mdash; nothing more.</p>'+
          '<form class="email-form"><input type="email" required placeholder="you@somewhere.com" autocomplete="email" /><button type="submit">Play</button></form>'+
          '<p class="email-err" aria-live="polite"></p></div>';
        document.body.appendChild(ov);
        var input=ov.querySelector('input'), submit=ov.querySelector('button[type=submit]'),
            closeBtn=ov.querySelector('.email-close'), errEl=ov.querySelector('.email-err'), form=ov.querySelector('form');
        setTimeout(function(){ input.focus(); },30);
        function dismiss(){ ov.remove(); document.removeEventListener('keydown',onEsc); resolve(false); }
        function onEsc(e){ if(e.key==='Escape') dismiss(); }
        document.addEventListener('keydown',onEsc);
        closeBtn.addEventListener('click',dismiss);
        ov.addEventListener('click',function(e){ if(e.target===ov) dismiss(); });
        form.addEventListener('submit',async function(e){
          e.preventDefault(); errEl.textContent='';
          var email=input.value.trim().toLowerCase();
          if(!EMAIL_RE.test(email)||email.length>254){ errEl.textContent='That doesn’t look like an email.'; return; }
          submit.disabled=true;
          try{ await fetch(API_BASE+'/api/email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})}); }catch(_){}
          try{ localStorage.setItem('sc_email',email); }catch(_){}
          document.removeEventListener('keydown',onEsc); ov.remove(); resolve(true);
        });
      });
    }

    // ── now playing ──
    var npEl=document.getElementById('now-playing'), npName=document.getElementById('np-name'),
        npSrc=document.getElementById('np-src'), npStop=document.getElementById('np-stop');
    npStop.addEventListener('click',function(){ stopActive(); });
    function showNP(name,src){ npName.textContent=name; npSrc.textContent=src; npEl.classList.add('show'); document.body.classList.add('has-np'); }
    function hideNP(){ npEl.classList.remove('show'); document.body.classList.remove('has-np'); }

    // ── playback (single active across all cards) ──
    var active=null;
    function setState(btn,ch){ var s=btn.querySelector('.state'); if(s) s.textContent=ch; }
    function slotFor(btn){ var c=btn.closest('.gcard'); return c?c.querySelector('.player-slot'):null; }
    function stopActive(){
      if(!active) return;
      active.button.classList.remove('playing');
      setState(active.button,'▶');
      if(active.slot) active.slot.innerHTML='';
      active=null; hideNP();
    }
    function openPlayer(btn,iframe,name,src){
      var slot=slotFor(btn); if(!slot) return;
      slot.innerHTML=''; slot.appendChild(iframe);
      btn.classList.add('playing'); setState(btn,'■');
      active={ button:btn, slot:slot };
      showNP(name,src);
    }
    function playSc(btn){
      var iframe=document.createElement('iframe'); iframe.allow='autoplay'; iframe.className='sc';
      iframe.src='https://w.soundcloud.com/player/?url='+encodeURIComponent(btn.dataset.sc)+'&color=%23ff7a6b&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=false';
      openPlayer(btn,iframe,btn.dataset.name||'Now playing','SOUNDCLOUD');
    }
    function playYt(btn,videoId){
      var iframe=document.createElement('iframe'); iframe.allow='autoplay; encrypted-media; picture-in-picture'; iframe.allowFullscreen=true; iframe.className='yt';
      iframe.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(videoId)+'?autoplay=1&rel=0';
      openPlayer(btn,iframe,btn.dataset.name||'Now playing','YOUTUBE');
    }
    function showMsg(btn,text){ var slot=slotFor(btn); if(!slot) return; slot.innerHTML='<p class="yt-msg">'+esc(text)+'</p>'; setTimeout(function(){ if(slot.querySelector('.yt-msg')) slot.innerHTML=''; },3000); }
    async function handleYtClick(btn){
      var wasMe=active&&active.button===btn;
      if(wasMe){ stopActive(); return; }
      if(!(await ensureEmailGate())) return;
      stopActive();
      if(btn.dataset.yt){ playYt(btn,btn.dataset.yt); return; }
      btn.disabled=true; btn.classList.add('spinning');
      try{
        var res=await fetch(API_BASE+'/api/youtube?slug='+encodeURIComponent(btn.dataset.slug)+'&name='+encodeURIComponent(btn.dataset.name));
        var json=await res.json().catch(function(){return {};});
        if(res.status===404){ showMsg(btn,'No long-form YouTube set found for this artist.'); return; }
        if(!res.ok){ showMsg(btn,'YouTube error: '+(json.error||res.status)); return; }
        btn.dataset.yt=json.videoId; playYt(btn,json.videoId);
      }catch(err){ showMsg(btn,'YouTube request failed: '+err.message); }
      finally{ btn.disabled=false; btn.classList.remove('spinning'); }
    }
    function wireCard(scope){
      scope.querySelectorAll('.play.sc').forEach(function(btn){
        btn.addEventListener('click',async function(){
          var wasMe=active&&active.button===btn;
          if(wasMe){ stopActive(); return; }
          if(!(await ensureEmailGate())) return;
          stopActive(); playSc(btn);
        });
      });
      scope.querySelectorAll('.play.yt').forEach(function(btn){
        btn.addEventListener('click',function(){ handleYtClick(btn); });
      });
      scope.querySelectorAll('.more-btn').forEach(function(btn){
        btn.addEventListener('click',function(){
          var ul=btn.closest('ul.line'); if(!ul) return;
          var exp=ul.classList.toggle('exp');
          btn.textContent = exp ? 'Show less' : '+ '+btn.dataset.extra+' more';
          if(!exp && active && active.button.closest('ul.line')===ul && active.button.closest('li').classList.contains('hid')) stopActive();
        });
      });
    }

    // ── lineup + card ──
    function lineupHTML(ev, cap){
      var arts=ev.artists||[];
      if(!arts.length) return '<li class="tba">Lineup TBA</li>';
      var n=arts.length, c=cap||n, html='';
      arts.forEach(function(a,idx){
        if(idx===c){ html+='<li class="more-li"><button class="more-btn" type="button" data-extra="'+(n-c)+'">+ '+(n-c)+' more</button></li>'; }
        var slug=a.contentUrl?a.contentUrl.split('/').filter(Boolean).pop():'';
        var sc=normaliseSc(a.soundcloud);
        var scBtn=sc?'<button class="play sc" data-sc="'+esc(sc)+'" data-name="'+esc(a.name)+'" title="Play top SoundCloud track">'+SC_SVG+'<span class="state">▶</span></button>':'<span class="no-sc">&mdash;</span>';
        var ytBtn=slug?'<button class="play yt" data-slug="'+esc(slug)+'" data-name="'+esc(a.name)+'" title="Play full set on YouTube">'+YT_SVG+'<span class="state">▶</span></button>':'';
        html+='<li'+(idx>=c?' class="hid"':'')+'>'+scBtn+ytBtn+'<span class="an">'+esc(a.name)+'</span></li>';
      });
      return html;
    }
    function cardHTML(ev){
      var time=formatTime(ev.startTime);
      var pick=isPickVenue(ev.venue)?'<span class="pick">Pick</span>':'';
      return '<div class="gcard">'+posterHTML(ev)+
        pick+
        '<h3>'+esc(ev.title)+'</h3>'+
        '<div class="meta"><b>'+esc(ev.venue||'TBA')+'</b>'+(time?' &middot; '+time:'')+'</div>'+
        '<ul class="line">'+lineupHTML(ev,5)+'</ul>'+
        '<div class="player-slot"></div>'+
      '</div>';
    }

    // Order: FOLD, MOT, Phonox, then top 2 by popularity, then the rest.
    function orderEvents(events){
      var used=new Array(events.length).fill(false), out=[];
      function takeFirst(re){
        for(var i=0;i<events.length;i++){ if(!used[i] && re.test(events[i].venue||'')){ used[i]=true; out.push(events[i]); return; } }
      }
      takeFirst(RE_FOLD); takeFirst(RE_MOT); takeFirst(RE_PHONOX);
      var added=0;
      for(var i=0;i<events.length && added<2;i++){ if(!used[i]){ used[i]=true; out.push(events[i]); added++; } }
      for(var i=0;i<events.length;i++){ if(!used[i]){ used[i]=true; out.push(events[i]); } }
      return out;
    }

    var gridEl=document.getElementById('grid'), trackEl=document.getElementById('track');
    function renderEvents(data){
      stopActive();
      var evs=data.events||[];
      document.getElementById('eyebrow').textContent='Tonight in London — '+evs.length+' event'+(evs.length===1?'':'s');
      if(evs.length===0){ gridEl.innerHTML='<div class="status">No events found for this date.</div>'; trackEl.innerHTML=''; return; }
      var ordered=orderEvents(evs);
      // ambient marquee of tonight's titles (duplicated for a seamless loop)
      var marq='';
      for(var k=0;k<2;k++){ ordered.forEach(function(e){ marq+='<span>'+esc(e.title)+'</span><span class="star">&#10039;</span>'; }); }
      trackEl.innerHTML=marq;
      gridEl.innerHTML=ordered.map(function(e){ return cardHTML(e); }).join('');
      wireCard(gridEl);
    }

    // ── status / load ──
    var statusEl=document.getElementById('status');
    function setStatus(html,isErr){ statusEl.innerHTML=html||''; statusEl.className='status'+(isErr?' error':''); }
    function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    function fmtDateLabel(iso){ var d=new Date(iso+'T12:00:00'); return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); }
    var currentDate=null;
    var dateLabel=document.getElementById('date-label'), dateInput=document.getElementById('date-input');
    async function load(date){
      currentDate=date; dateLabel.textContent=fmtDateLabel(date); dateInput.value=date;
      document.title='soundcheck by 6 Minutes · '+date; history.replaceState(null,'','?date='+date);
      setStatus('<span class="spinner"></span> Loading '+esc(fmtDateLabel(date))+'…'); gridEl.innerHTML='';
      try{
        var res=await fetch(API_BASE+'/api/day?date='+encodeURIComponent(date));
        var json=await res.json();
        if(!res.ok) throw new Error(json.error||('HTTP '+res.status));
        setStatus(''); renderEvents(json);
      }catch(err){ setStatus('Error: '+esc(err.message||String(err)),true); }
    }
    function shiftDate(days){ var d=new Date(currentDate+'T12:00:00'); d.setDate(d.getDate()+days); load(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')); }
    document.getElementById('prev-day').addEventListener('click',function(){ shiftDate(-1); });
    document.getElementById('next-day').addEventListener('click',function(){ shiftDate(1); });
    dateLabel.addEventListener('click',function(){ if(dateInput.showPicker){ try{dateInput.showPicker();}catch(_){dateInput.focus();} } else dateInput.focus(); });
    dateInput.addEventListener('change',function(){ if(dateInput.value) load(dateInput.value); });

    // ── inline signup ──
    var signupForm=document.getElementById('inline-form'), signupSuccess=document.getElementById('signup-success');
    if(hasEmail()){ signupForm.hidden=true; signupSuccess.hidden=false; }
    signupForm.addEventListener('submit',async function(e){
      e.preventDefault();
      var input=signupForm.querySelector('input'), btn=signupForm.querySelector('button');
      var email=input.value.trim().toLowerCase();
      if(!EMAIL_RE.test(email)||email.length>254){ input.focus(); return; }
      btn.disabled=true;
      try{ await fetch(API_BASE+'/api/email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})}); }catch(_){}
      try{ localStorage.setItem('sc_email',email); }catch(_){}
      signupForm.hidden=true; signupSuccess.hidden=false;
    });

    var initial=new URLSearchParams(location.search).get('date')||todayISO();
    load(initial);
  </script>
</body>
</html>
